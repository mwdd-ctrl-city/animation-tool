<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/timeline.css">


    <title>Animation Tool</title>
</head>

<body>
    <header></header>
    <main>

        <!-- The output of the animation/timeline -->
        <div class="canvas">
            <h1 class="text">Welkom bij de typography animation tool!!!</h1>
        </div>

        <!-- The UI interface of the timeline -->
        <form class="timeline">
            <button type="button" class="play-animation">Play</button>
            <label for="timeline-slider">Tijdlijn slider</label>
            <input type="range" id="timeline-slider" min="0" max="100" value="0" step="any">
        </form>


        <!-- Control panel interface -->
        <div class="controls-panel">
            <!-- Insert the code forms here -->
            <label>X</label>
            <input type="range" class="animation-control" data-property="x" min="0" max="1000" value="0">
            
            <label>Rotation</label>
            <input type="range" class="animation-control" data-property="rotation" min="0" max="360" value="0">
            
            <label>ScaleY</label>
            <input type="range" class="animation-control" data-property="scaleY" min="1" max="5" value="1" step="0.1">
        </div>
    </main>
    <footer></footer>
    <!-- Insert the gsap library -->
    <!-- https://gsap.com/docs/v3/Installation/?tab=cdn&module=esm&require=false -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="./scripts/script.js"></script>
    <script src="./scripts/timeline.js"></script>

</body>

</html>
