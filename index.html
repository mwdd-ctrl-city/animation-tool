<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/timeline.css" />
  <link rel="stylesheet" href="./styles/canvas.css" />

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js" defer></script>
  <script src="./scripts/script.js" type="module" defer></script>
  <script src="./scripts/timeline.js" type="module" defer></script>

  <title>Animation Tool</title>
</head>

<body>
  <header></header>
  <main>
    <!-- The output of the animation/timeline -->
    <div class="canvas">
    </div>


    <!-- The UI interface of the timeline -->
    <form class="timeline">
      <button type="button" class="play-animation">Play</button>
      <label for="timeline-slider">Timeline slider</label>
      <div class="tl-time">
        <span class="tl-time-start">0.00s</span>
        <span class="tl-time-end">4.00s</span>
      </div>
      <input type="range" id="timeline-slider" min="0" max="100" value="0" step="any" />

      <div class="timeline-container">
        <div class="track">
          <div class="bar"></div>
        </div>
      </div>
    </form>



    <!-- Control panel interface -->
    <div class="controls-panel">
      <!-- Insert the code forms here -->
      <input type="text" id="input-text">
      <button type="button" id="input-button">Verstuur</button>

      <label>X</label>
      <input type="range" class="animation-control" data-property="x" min="0" max="1000" value="0" />

      <label>Rotation</label>
      <input type="range" class="animation-control" data-property="rotation" min="0" max="360" value="0" />

      <label>ScaleY</label>
      <input type="range" class="animation-control" data-property="scaleY" min="1" max="5" value="1" step="0.1" />

      <label>Font Weight</label>
      <input type="range" class="animation-control" data-property="fontWeight" min="100" max="900" value="100"
        step="100" />

      <label>Font size</label>
      <input type="range" class="animation-control" data-property="fontSize" min="10" max="1000" value="100"
        step="10" />

      <label>Letter spacing</label>
      <input type="range" class="animation-control" data-property="letterSpacing" min="-5" max="20" value="3"
        step="1" />

      <div class="animation-direction">
        <label>Direction</label>
        <select id="animation-direction" data-property="rotation">
          <option value="0">Normal</option>
          <option value="-90">Left</option>
          <option value="90">Right</option>
          <option value="180">Reverse</option>
        </select>
      </div>

      <div class="text-casing">
        <label>Text Casing</label>
        <label><input data-property="textTransform" type="radio" name="text-case" value="none" checked>
          Initial</label>
        <label><input data-property="textTransform" type="radio" name="text-case" value="capitalize"> Capitalize</label>
        <label><input data-property="textTransform" type="radio" name="text-case" value="lowercase"> lowercase</label>
        <label><input data-property="textTransform" type="radio" name="text-case" value="uppercase"> UPPERCASE</label>
      </div>
    </div>
  </main>
  <footer></footer>
</body>

</html>
