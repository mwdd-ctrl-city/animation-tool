<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="./assets/icon/favicon.png">

    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/styles/main-layout.css" />
    <link rel="stylesheet" href="/styles/timeline.css" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="/scripts/main-layout.js" defer></script>
    <script src="./scripts/timeline.js" type="module" defer></script>

    <title>Animation Tool</title>
</head>

<body>
    <header class="topbar">
        <div class="project-name-place">
            <span id="project-name">Untitled Project</span>
            <input id="project-name-input" type="text" value="Untitled Project">
        </div>

        <button class="preview-button">Preview</button>
        <button class="save-button">Save</button>
    </header>


    <main>
        <div role="toolbar" aria-label="Tools" class="toolbar-panel">
            <ul>
                <li>
                    <button type="button" class="action-button add-text-button" aria-label="Add text" title="Add text">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M4 4h16v3.5h-2V6H13v13h1.5v2h-5v-2H11V6H6v1.5H4V4z" fill="currentColor" />
                        </svg>
                    </button>
                </li>
                <li>
                    <button type="button" class="control-button undo" aria-label="Undo" title="Undo">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </li>
                <li>
                    <button type="button" class="control-button redo" aria-label="Redo" title="Redo">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            style="transform: scaleX(-1);">
                            <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </li>
            </ul>

        </div>

        <!--  CONTENT CONTAINER    -->
        <section class="content-panel">
            <div class="content-canvas">
                <!-- The output of the animation/timeline -->
                <div class="canvas"></div>
            </div>
        </section>

        <!--   ITEMS CONTAINER  -->
        <section class="items-panel">
            <div class="resize-handle handle-left"></div>

            <details open class="fieldset-container">
                <summary>Typography</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Typography</legend>

                    <label>
                        Font size
                        <input type="range" class="animation-control" data-property="fontSize" min="0" max="200"
                            value="16" step="1" />
                    </label>

                    <label>
                        Opacity
                        <input type="range" class="animation-control" data-property="opacity" min="0" max="1" value="1"
                            step="0.01" />
                    </label>

                    <label>
                        Font weight
                        <input type="range" class="animation-control" data-property="fontWeight" min="100" max="900"
                            value="400" step="100" />
                    </label>

                    <label>
                        Letter spacing
                        <input type="range" class="animation-control" data-property="letterSpacing" min="-5" max="20"
                            value="0" step="0.5" />
                    </label>

                    <!-- NEW -->
                    <label>
                        Word spacing
                        <input type="range" class="animation-control" data-property="wordSpacing" min="-10" max="50"
                            value="0" step="0.5" />
                    </label>


                </fieldset>
            </details>

            <details open class="fieldset-container">
                <summary>Transform</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Transform</legend>

                    <label>
                        Scale X
                        <input type="range" class="animation-control" data-property="scaleX" min="0" max="5" value="1"
                            step="0.05" />
                    </label>

                    <label>
                        Scale Y
                        <input type="range" class="animation-control" data-property="scaleY" min="0" max="5" value="1"
                            step="0.05" />
                    </label>

                    <label>
                        Skew X
                        <input type="range" class="animation-control" data-property="skewX" min="-90" max="90" value="0"
                            step="1" />
                    </label>

                    <label>
                        Skew Y
                        <input type="range" class="animation-control" data-property="skewY" min="-90" max="90" value="0"
                            step="1" />
                    </label>

                    <label>
                        Rotation
                        <input type="range" class="animation-control" data-property="rotation" min="-360" max="360"
                            value="0" step="1" />
                    </label>

                    <!-- NEW -->
                    <label>
                        Rotation X (3D)
                        <input type="range" class="animation-control" data-property="rotationX" min="-360" max="360"
                            value="0" step="1" />
                    </label>

                    <!-- NEW -->
                    <label>
                        Rotation Y (3D)
                        <input type="range" class="animation-control" data-property="rotationY" min="-360" max="360"
                            value="0" step="1" />
                    </label>


                </fieldset>
            </details>

            <details open class="fieldset-container">
                <summary>Animation functions</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Animation functions</legend>

                    <div class="animation-direction">
                        <label>Direction</label>
                        <select id="animation-direction" data-property="rotation">
                            <option value="0">Normal</option>
                            <option value="-90">Left</option>
                            <option value="90">Right</option>
                            <option value="180">Reverse</option>
                        </select>
                    </div>

                    <div class="animation-ease">
                        <label>Easing</label>
                        <select id="animation-select-ease">
                            <option value="none">Linear</option>
                            <option value="power1.in">Ease-in</option>
                            <option value="power1.out">Ease-out</option>
                            <option value="bounce.in">Bounce-in</option>
                            <option value="bounce.out">Bounce-out</option>
                            <option value=" back.in(1.7)">Back-in</option>
                            <option value="back.out(1.7)">Back-out</option>
                        </select>
                    </div>

                    <div class="text-casing">
                        <label>Text casing</label>
                        <div class="text-casing-options">
                            <label>
                                <input data-property="textTransform" type="radio" name="text-case" value="none" checked>
                                <span>Initial</span>
                            </label>
                            <label>
                                <input data-property="textTransform" type="radio" name="text-case" value="capitalize">
                                <span>Capitalize</span>
                            </label>
                            <label>
                                <input data-property="textTransform" type="radio" name="text-case" value="lowercase">
                                <span>lowercase</span>
                            </label>
                            <label>
                                <input data-property="textTransform" type="radio" name="text-case" value="uppercase">
                                <span>UPPERCASE</span>
                            </label>
                        </div>
                    </div>

                </fieldset>
            </details>

        </section>


        <!--   TIMELINE   -->
        <div class="timeline-panel">
            <div class="resize-handle handle-top"></div>

            <form class="timeline">
                <button type="button" class="play-animation">Play</button>

                <label for="timeline-slider" class="visually-hidden">Timeline slider</label>

                <div class="tl-time">
                    <label for="start-time" class="visually-hidden">Start time</label>
                    <input id="start-time" type="number" value="0.00" step="0.01" class="tl-time-start">

                    <label for="end-time" class="visually-hidden">End time</label>
                    <input id="end-time" type="number" value="4.00" step="0.01" class="tl-time-end">
                </div>
                <div>
                    <button type="button" class="kf-prev"><</button>
                    <button type="button" class="kf-next">></button>
                </div>

                <label for="timeline-slider" class="visually-hidden">Timeline slider</label>
                <input type="range" id="timeline-slider" min="0" max="100" value="0" step="any" />

                <div class="timeline-container">
                    <div class="track">
                        <div class="bar"></div>
                    </div>
                </div>
            </form>
        </div>

    </main>
    <footer></footer>
</body>




</html>
