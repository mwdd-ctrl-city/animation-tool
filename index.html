<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icon/favicon-dark.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="./assets/icon/favicon-light.svg" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/main-layout.css" />
    <link rel="stylesheet" href="./styles/timeline.css" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>
    <script src="./scripts/libraries/jszip.js"></script>
    <script src="./scripts/main-layout.js" type="module" defer></script>
    <script src="./scripts/timeline.js" type="module" defer></script>
    <script src="./scripts/preview.js" type="module" defer></script>

    <title>(Inter)play - Animationtool</title>
</head>

<body>
    <header class="topbar">
        <div class="project-name-place">
            <span id="project-name"></span>
            <input id="project-name-input" type="text">
        </div>

        <button popovertarget="popover-original" id="open-button" class="preview-button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12C1 12 4.5 5 12 5C19.5 5 23 12 23 12C23 12 19.5 19 12 19C4.5 19 1 12 1 12Z"
                    stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                <circle cx="12" cy="12" r="3.8" stroke="currentColor" stroke-width="2" />
            </svg>
            Preview
        </button>

        <input type="file" id="load-input" accept="application/json" hidden>
        <button class="load-button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 16V4M12 4L8 8M12 4L16 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M3 17V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V17" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" />
            </svg>
            Import
        </button>

        <button class="save-button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V16M12 16L8 12M12 16L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M3 17V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V17" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" />
            </svg>
            Export
        </button>
    </header>


    <main>
        <div role="toolbar" aria-label="Tools" class="toolbar-panel">
            <ul>
                <li>
                    <button type="button" class="action-button add-text-button" aria-label="Add text" title="Add text">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M4 4h16v3.5h-2V6H13v13h1.5v2h-5v-2H11V6H6v1.5H4V4z" fill="currentColor" />
                        </svg>
                    </button>
                </li>
                <li>
                    <button type="button" class="control-button undo" aria-label="Undo" title="Undo">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </li>
                <li>
                    <button type="button" class="control-button redo" aria-label="Redo" title="Redo">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            style="transform: scaleX(-1);">
                            <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </li>
                <li class="reset-buttons-container">
                    <button type="button" class="control-button reset" aria-label="Reset" title="Reset">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path
                                d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M5 6l1.5 14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2L19 6M10 10.5v5M14 10.5v5"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button type="button" class="confirm-reset">Confirm reset</button>
                </li>
            </ul>

        </div>

        <!--  CONTENT CONTAINER    -->
        <section id="original-canvas" class="content-panel">
            <div class="content-canvas">
                <!-- The output of the animation/timeline -->
            </div>
        </section>

        <!-- POPOVER PREVIEW -->
        <section id="popover-original" popover>
            <div id="popover-content">

            </div>
            <button type="button" class="close-button" popovertarget="popover-original"
                popovertargetaction="hide">close</button>
        </section>


        <!--   ITEMS CONTAINER  -->
        <section class="items-panel">
            <div class="resize-handle handle-left"></div>

            <details open class="fieldset-container">
                <summary>Delete</summary>

                <fieldset class="item">
                    <legend class="visually-hidden">Delete</legend>

                    <div class="delete-text">
                        <p>Delete element</p>
                        <button>Delete</button>
                    </div>
                </fieldset>
            </details>

            <details open class="fieldset-container">
                <summary>Typography</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Typography</legend>

                    <label>
                        Font size
                        <div class="slider-input-container">
                            <input type="range" class="animation-control" data-property="fontSize" min="0" max="200"
                                value="16" step="1" />
                            <div class="number-input-wrapper px">
                                <input type="number" class="animation-control" data-property="fontSize" value="16"
                                    step="1" />
                                <p class="unit">px</p>
                            </div>
                        </div>
                    </label>

                    <label>
                        Opacity
                        <input type="range" class="animation-control" data-property="opacity" min="0" max="1" value="1"
                            step="0.01" />
                    </label>

                    <label>
                        Font weight
                        <input type="range" class="animation-control" data-property="fontWeight" min="100" max="900"
                            value="400" step="100" />
                    </label>

                    <label>
                        Line height
                        <div class="slider-input-container">
                            <input type="range" class="animation-control" data-property="lineHeight" min="0" max="50"
                                value="16" step="1" />
                            <div class="number-input-wrapper px">
                                <input type="number" class="animation-control" data-property="lineHeight" value="16"
                                    step="1" />
                                <p class="unit">px</p>
                            </div>
                        </div>

                    </label>

                    <!-- <label>
                        Letter spacing
                        <input type="range" class="animation-control" data-property="letterSpacing" min="-5" max="20"
                            value="0" step="0.5" />
                    </label> -->

                    <!-- <label>
                        Word spacing
                        <input type="range" class="animation-control" data-property="wordSpacing" min="-10" max="50"
                            value="0" step="0.5" />
                    </label> -->

                </fieldset>
            </details>

            <details open class="fieldset-container">
                <summary>Transform</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Transform</legend>

                    <label>
                        Scale X
                        <div class="slider-input-container">
                            <input type="range" class="animation-control" data-property="scaleX" min="0" max="5"
                                value="1" step="0.05" />

                            <div class="number-input-wrapper">
                                <input type="number" class="animation-control" data-property="scaleX" value="1"
                                    step="0.05" />
                                <p class="unit">x</p>
                            </div>
                        </div>
                    </label>

                    <label>
                        Scale Y
                        <div class="slider-input-container">
                            <input type="range" class="animation-control" data-property="scaleY" min="0" max="5"
                                value="1" step="0.05" />
                            <div class="number-input-wrapper">
                                <input type="number" class="animation-control" data-property="scaleY" value="1"
                                    step="0.05" />
                                <p class="unit">x</p>
                            </div>
                        </div>
                    </label>

                    <label>
                        Skew X
                        <input type="range" class="animation-control" data-property="skewX" min="-90" max="90" value="0"
                            step="1" />
                    </label>
                    <label>
                        Skew Y
                        <input type="range" class="animation-control" data-property="skewY" min="-90" max="90" value="0"
                            step="1" />
                    </label>

                    <label>
                        Rotation
                        <input type="range" class="animation-control" data-property="rotation" min="-360" max="360"
                            value="0" step="1" />
                    </label>

                    <!-- NEW -->
                    <label>
                        Rotation X (3D)
                        <input type="range" class="animation-control" data-property="rotationX" min="-360" max="360"
                            value="0" step="1" />
                    </label>

                    <!-- NEW -->
                    <label>
                        Rotation Y (3D)
                        <input type="range" class="animation-control" data-property="rotationY" min="-360" max="360"
                            value="0" step="1" />
                    </label>


                    <div class="animation-direction">
                        <label>Direction</label>
                        <div class="layout-radios">
                            <label><input class="animation-control" data-property="rotation" type="radio"
                                    name="animation-direction" value="0" checked>
                                Normal</label>
                            <label><input class="animation-control" data-property="rotation" type="radio"
                                    name="animation-direction" value="-90">
                                Left</label>
                            <label><input class="animation-control" data-property="rotation" type="radio"
                                    name="animation-direction" value="90">
                                Right</label>
                            <label><input class="animation-control" data-property="rotation" type="radio"
                                    name="animation-direction" value="180">
                                Reverse</label>
                        </div>
                    </div>
                </fieldset>
            </details>


            <details open class="fieldset-container">
                <summary>Colors</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Colors</legend>

                    <label>
                        Fill
                        <input type="range" class="animation-control" data-property="color" data-property-type="color"
                            min="0" max="255" value="0" step="1" />
                    </label>
                    <label>
                        Background
                        <input type="range" class="animation-control" data-property="backgroundColor"
                            data-property-type="color" min="0" max="255" value="255" step="1" />
                    </label>
                    <label>
                        Outline
                        <input type="range" class="animation-control" data-property="webkitTextStrokeColor"
                            data-property-type="color" min="0" max="255" value="0" step="1" />

                    </label>
                    <label>
                        Outline width
                        <input type="range" class="animation-control" data-property="webkitTextStrokeWidth" min="0"
                            max="5" value="0" step="1">
                    </label>
                </fieldset>
            </details>

            <details open class="fieldset-container">
                <summary>Animation style</summary>

                <fieldset class="item item-typography">
                    <legend class="visually-hidden">Animation style</legend>

                    <div class="split-text">
                        <label>Split type</label>
                        <div class="split-text-buttons layout-radios">
                            <label>
                                <input id="btn-split-none" name="split-type" type="radio" checked>
                                None
                            </label>
                            <label>
                                <input id="btn-split-chars" name="split-type" type="radio">
                                Characters
                            </label>
                            <label>
                                <input id="btn-split-words" name="split-type" type="radio">
                                Words
                            </label>
                            <label>
                                <input id="btn-split-lines" name="split-type" type="radio">
                                Lines
                            </label>
                        </div>
                    </div>

                    <div class="animation-ease">
                        <label>
                            Easing function
                            <select id="animation-select-ease">
                                <option value="none">Linear</option>
                                <option value="power1.in">Ease-in</option>
                                <option value="power1.out">Ease-out</option>
                                <option value="bounce.in">Bounce-in</option>
                                <option value="bounce.out">Bounce-out</option>
                                <option value=" back.in(1.7)">Back-in</option>
                                <option value="back.out(1.7)">Back-out</option>
                            </select>
                        </label>
                    </div>
                </fieldset>
            </details>
        </section>


        <!--   TIMELINE   -->
        <div class="timeline-panel">
            <div class="resize-handle handle-top">
                <span class="drag-dots"></span>
            </div>

            <form class="timeline">
                <label for="timeline-slider" class="visually-hidden">Timeline</label>

                <button type="button" class="play-animation">Play</button>

                <div class="keyframe-snap">
                    <button type="button" class="kf-prev" aria-live="polite" aria-label="Go to next keyframe">
                        <i aria-hidden="true">←</i>
                    </button>
                    <button type="button" class="kf-next" aria-live="polite" aria-label="Go to previous keyframe">
                        <i aria-hidden="true">→</i>
                    </button>
                </div>

                <div class="tl-time">
                    <!-- <label for="start-time" class="visually-hidden">Start time</label>
                    <div class="number-input-wrapper">
                        <input id="start-time" type="number" value="0.00" step="0.01" class="tl-time-start">
                        <p class="unit">s</p>
                    </div> -->

                    <label for="end-time" class="visually-hidden">End time</label>
                    <div class="number-input-wrapper">
                        <input id="end-time" type="number" value="5.00" step="0.01" class="tl-time-end">
                        <p class="unit">s</p>
                    </div>
                </div>


                <div class="slider-wrapper" style="--min: 0; --max: 100; --val: 0">
                    <label for="timeline-slider" class="visually-hidden">Timeline slider</label>
                    <input type="range" id="timeline-slider" min="0" max="100" value="0" step="any" />
                    <div class="playhead-time .tl-time-start">0,00 <span class="unit">s</span></div>
                </div>


                <div class="timeline-container">
                    <div class="track">
                        <div class="bar"></div>
                    </div>
                </div>
            </form>

            <!-- Claude: How do I make it accessible? -->
            <div class="scroll-hint" role="status" aria-live="polite" aria-label="More content available, scroll down">
                <p>scroll to see more</p>
                <i aria-hidden="true">↓</i>
            </div>
        </div>

    </main>
    <footer></footer>
</body>




</html>
